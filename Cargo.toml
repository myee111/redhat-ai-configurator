[package]
name = "redhat-ai-configurator"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Guided installer that configures goose for Red Hat AI MaaS (rhai-maas) and EnMaaS"
repository = "https://github.com/myee111/redhat-ai-configurator"

[[bin]]
name = "redhat-ai-configurator"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"
